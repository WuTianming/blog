<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RNG Swiss Roll 3D Demo</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: #f7f2eb;
        color: #1a1a1a;
      }
      .wrap {
        max-width: 980px;
        margin: 24px auto 40px;
        padding: 0 16px;
      }
      h1 {
        font-weight: 600;
        letter-spacing: 0.5px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 16px;
        color: #3a3a3a;
      }
      #stage {
        width: 100%;
        height: 640px;
        border: 1px solid #d9d2c5;
        background: #fffaf2;
      }
      .meta {
        margin-top: 10px;
        font-size: 14px;
        color: #575757;
      }
      code {
        background: #efe6d8;
        padding: 0 4px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>RNG Swiss Roll 3D Demo</h1>
      <p>Builds an RNG graph over a Swiss roll dataset and draws all edges in 3D.</p>
      <div id="stage"></div>
      <div class="meta" id="status">Loading…</div>
      <div class="meta">
        Uses <code>anns_sim/js/rng_graph.js</code> with default seed.
      </div>
    </div>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
